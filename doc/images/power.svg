<text x="1020.0" y="244.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle" font-weight="normal" >5V (VIN) · GND</text>
