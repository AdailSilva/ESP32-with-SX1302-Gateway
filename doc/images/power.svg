<text x="560.0" y="262.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" >GND comum</text>
<text x="620.0" y="300.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal" >Os picos de corrente na transmissão LoRa podem derrubar o USB do PC e resetar o SX1302 no meio de um TX. Em uso contínuo, use a fonte de 5 V.</text>
