; PlatformIO (alternative to idf.py / scripts/build.sh)
; Two environments, one per supported board:
;   esp32dev -> ESP32-WROOM-32U DevKit           (pin map comes from main/CMakeLists.txt)
;   esp32s3  -> ESP32-S3-WROOM-2 (N32R16V) DevKit

[platformio]
src_dir = main

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
framework = espidf
platform = espressif32@6.11.0
extra_scripts = pre:platformio_pre.py
board_build.partitions = partitions_singleapp_large.csv

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
; WROOM-2 N32R16V: 32 MB octal flash + 16 MB octal PSRAM
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

build_flags =
    -DSX1302_SPI_HOST=SPI2_HOST
    -DPIN_NUM_CLK=12
    -DPIN_NUM_MISO=13
    -DPIN_NUM_MOSI=11
    -DPIN_NUM_CS=10
    -DSX1302_RESET_PIN=6
    -DSX1302_POWER_EN_PIN=GPIO_NUM_NC
    -DSX1261_NSS_PIN=7
    -DI2C_MASTER_SDA_IO=4
    -DI2C_MASTER_SCL_IO=5
    -DGPS_UART_TXD=17
    -DGPS_UART_RXD=18
    -DUSER_BUTTON_1=0
    -DUSER_BUTTON_2=GPIO_NUM_NC
    -DBLINK_GPIO=GPIO_NUM_NC
    -DLED_BLUE_GPIO=GPIO_NUM_NC
    -DLED_GREEN_GPIO=GPIO_NUM_NC
    -DLED_RED_GPIO=GPIO_NUM_NC
