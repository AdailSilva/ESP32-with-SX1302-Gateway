# Builds the firmware for both boards.
#
#   push / pull request -> binaries as workflow artifacts, version from "git describe"
#                          (e.g. 0.0.1-3-gabc1234)
#   tag vX.Y.Z          -> GitHub Release "vX.Y.Z" with the binaries of version X.Y.Z
#   tag vX.Y.Z-rc1      -> same, marked as pre-release
#
# The version written into the firmware (boot banner, web page, MQTT metadata,
# app descriptor) always comes from the tag: nothing to edit by hand.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and history for git describe

      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH (e.g. v0.0.1 or v0.1.0-rc1)"
              exit 1
            fi
            ver="${tag#v}"
            release=true
            case "$ver" in *-*) pre=true ;; *) pre=false ;; esac
          else
            ver=$(git describe --tags --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
            [ -n "$ver" ] || ver="0.0.0-dev+$(git rev-parse --short HEAD)"
            release=false
            pre=false
          fi
          echo "version=$ver"       >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"    >> "$GITHUB_OUTPUT"
          echo "### Firmware version: \`$ver\`" >> "$GITHUB_STEP_SUMMARY"

  firmware:
    name: ${{ matrix.board }}
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            board: ESP32-WROOM-32U_DevKit
          - target: esp32s3
            board: ESP32-S3-WROOM-2_N32R16V_DevKit
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          sh scripts/build.sh ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          t=${{ matrix.target }}
          b=build-$t
          name="esp32_sx1302-$FW_VERSION-$t"
          d=dist/$t
          mkdir -p "$d"

          # 1) single image: write at 0x0 with any flasher (esptool, ESP Web Tools, Flash Download Tool)
          (cd "$b" && python -m esptool --chip "$t" merge_bin -o "../$d/$name-full.bin" @flash_args)

          # 2) application only: firmware update of a board that already runs the gateway (0x10000)
          cp "$b/ESP32_SX1302-Pkt-Fwd.bin" "$d/$name-app.bin"

          # 3) separate parts + offsets, for esptool write_flash @flash_args
          mkdir -p "$d/parts"
          cp "$b/bootloader/bootloader.bin" "$b/partition_table/partition-table.bin" \
             "$b/ESP32_SX1302-Pkt-Fwd.bin" "$b/flash_args" "$b/flasher_args.json" "$d/parts/"
          (cd "$d/parts" && python -m zipfile -c "../$name-parts.zip" *) && rm -rf "$d/parts"

          ls -l "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: esp32_sx1302-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..

          # notes = section "## vX.Y.Z" of doc/CHANGELOG.md (if present)
          awk -v v="## v$VERSION" '
            index($0, v) == 1 { on = 1; next }
            on && /^(## |---)/ { exit }
            on { print }' doc/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Firmware v$VERSION" > notes.md
          cat >> notes.md <<EOF

          ### Arquivos
          | Placa | Imagem única (gravar em 0x0) | Só a aplicação (0x10000) |
          |---|---|---|
          | ESP32-WROOM-32U DevKit | \`esp32_sx1302-$VERSION-esp32-full.bin\` | \`esp32_sx1302-$VERSION-esp32-app.bin\` |
          | ESP32-S3-WROOM-2 (N32R16V) DevKit | \`esp32_sx1302-$VERSION-esp32s3-full.bin\` | \`esp32_sx1302-$VERSION-esp32s3-app.bin\` |

          \`\`\`bash
          esptool.py --chip esp32   -p /dev/ttyUSB0 write_flash 0x0 esp32_sx1302-$VERSION-esp32-full.bin
          esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x0 esp32_sx1302-$VERSION-esp32s3-full.bin
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
